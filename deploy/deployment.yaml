apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  # Remove this line when you turn on the HPA (examples/hpa), or Argo CD and
  # the autoscaler will keep resetting each other.
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      # The app never calls the Kubernetes API (Radar Check).
      automountServiceAccountToken: false
      # Spread the 2 replicas over nodes; ScheduleAnyway so a pod never stays Pending (Radar Check).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: app
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TEAM_NAME
              value: "mp"
            - name: ELASTIC_URL
              valueFrom:
                secretKeyRef:
                  name: elastic
                  key: url
            - name: ELASTIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: elastic
                  key: api-key
            # OpenTelemetry -> Dash0 (zero-code: auto-instrumentation via --require).
            - name: NODE_OPTIONS
              value: "--require @opentelemetry/auto-instrumentations-node/register"
            - name: OTEL_SERVICE_NAME
              value: "pokemon-go-for-people"
            - name: OTEL_NODE_ENABLED_INSTRUMENTATIONS
              value: "http,undici"
            - name: OTEL_NODE_RESOURCE_DETECTORS
              value: "env,host,os,process"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.namespace.name=team-mp,k8s.pod.name=$(POD_NAME),deployment.environment=hackathon"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: dash0
                  key: endpoint
                  optional: true
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: dash0
                  key: headers
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          # Read-only root filesystem; /tmp is the only writable path (Radar Check).
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
